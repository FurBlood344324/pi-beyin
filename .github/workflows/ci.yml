name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Host packages are needed for types/schemas only; pi provides them at runtime.
      # Version pinned on purpose: when the pi API changes, typecheck breaks here first.
      - name: Host packages
        run: bun add --no-save @earendil-works/pi-coding-agent@1.4.0 @earendil-works/pi-ai@1.4.0 @types/node typescript

      - name: typecheck
        run: bun run typecheck

      # No test needs a vault, a model or network: the beyin CLI is a fake script.
      - name: smoke
        run: bun run test/smoke.ts

      - name: beyin adapter
        run: bun run test/test-beyin.ts

      - name: batch
        run: bun run test/test-batch.ts
