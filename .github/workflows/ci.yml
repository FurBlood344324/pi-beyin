name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Host packages are needed for types/schemas only; pi provides them at runtime.
      # Version pinned on purpose: when the pi API changes, typecheck breaks here first.
      - name: Host packages
        run: bun add --no-save @earendil-works/pi-coding-agent@1.4.0 @earendil-works/pi-ai@1.4.0 @types/node

      - name: typecheck
        run: bun run typecheck

      # These tests do not need a vault. The vault-dependent ones (context, advisor,
      # E2E, scenario) run locally: bash test/run.sh
      - name: smoke
        run: bun run test/smoke.ts

      - name: skills
        run: bun run test/test-skills.ts

      - name: damitma
        run: bun run test/test-damitma.ts

      - name: jev
        run: bun run test/test-jev.ts
