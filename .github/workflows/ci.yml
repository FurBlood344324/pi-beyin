name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Host paketleri yalnız tip/şema için; çalışma anında pi sağlar.
      # Sürüm sabit: API değişince typecheck burada kırılsın, sürpriz olmasın.
      - name: Host paketleri
        run: bun add --no-save @earendil-works/pi-coding-agent@1.4.0 @earendil-works/pi-ai@1.4.0 @types/node

      - name: typecheck
        run: bun run typecheck

      # Bu testler vault'a bağlı değildir. Vault'a bakanlar (context/advisor,
      # E2E, senaryo) yerelde koşulur: bash test/run.sh
      - name: smoke
        run: bun run test/smoke.ts

      - name: damitma
        run: bun run test/test-damitma.ts

      - name: jev
        run: bun run test/test-jev.ts
