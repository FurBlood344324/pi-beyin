name: publish

on:
  push:
    tags:
      - "v*"
  # Publishing from the GitHub side without a tag dance: `gh workflow run publish.yml --ref main`.
  # The version is taken from package.json, so an already-published version is skipped (idempotent).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # OIDC trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "version: $pkg"

      # Host packages are peer dependencies; only needed to typecheck and run the suite.
      - name: Host packages
        run: bun add --no-save @earendil-works/pi-coding-agent@1.4.0 @earendil-works/pi-ai@1.4.0 @types/node

      - name: Verify
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test/smoke.ts
          bun run test/test-skills.ts
          bun run test/test-distillation.ts
          bun run test/test-jev.ts

      # A dispatch run must be safe to fire at any time: publishing an existing version is a
      # no-op (npm would otherwise fail with "cannot publish over the previously published
      # versions"), so the workflow stays green and reports what it did.
      - name: Already published?
        id: published
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "pi-beyin@$version" version >/dev/null 2>&1; then
            echo "pi-beyin@$version is already on npm — nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "pi-beyin@$version is not on npm yet — will publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.published == 'false'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          echo "publishing $version (dist-tag: $dist_tag)"
          npm publish --access public --provenance --tag "$dist_tag"
